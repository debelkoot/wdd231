<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Rapid Adventure Rafting</title>

    <meta name="description" content="Get in touch with Rapid Adventure Rafting. Contact us via phone, email, or send us a message through our online form.">
    <meta name="author" content="Debela Mendara Refisa">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/rafting-logo.jpg" alt="Rapid Adventure Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1 class="company-heading">White Water Rafting Company</h1>

        <section class="company-info">
            <div class="address-details">
                <p><strong>1000 Hora Finfinne </strong></p>
                <p>Finfinne, Oromiya</p>
                <p>0715553536</p>
                <p>d.mendara5@gmail.com </p>
            </div>

            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450937!2d-122.41941550000001!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80858064cb1a1a7d%3A0xb35a092ef2e5576a!2sSan%20Francisco%20City%20Hall!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus" 
                    width="300" 
                    height="200" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade"
                    title="Company Location Map">
                </iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-item">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username" placeholder="Placeholder" required>
                </div>

                <div class="form-item">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="Placeholder" required>
                </div>

                <fieldset class="form-item purpose-group">
                    <legend>Message Purpose</legend>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type here" required></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-profiles">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee Profile - General Manager">
                    <figcaption>General Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee Profile - Lead Guide">
                    <figcaption>Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee Profile - Safety Officer">
                    <figcaption>Safety Officer</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Rapid Adventure Rafting | Debela Mendara Refisa</p>

        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.jpg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>
            <a href="https://youtube.com" target="_blank" rel="noopener">
                <img src="images/youtube.jpg" alt="YouTube Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
